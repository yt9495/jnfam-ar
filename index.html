  const r = await fetch(CFG.aiProxyUrl, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ idToken, ...payload }) });
  const j = await r.json().catch(() => ({ ok: false, error: 'AI server HTTP ' + r.status }));
  if (!j.ok) throw new Error(j.error || 'AI server error');
  return j;
}

/* =====================================================================
   Register (upload & parse) view, router, init
   ===================================================================== */
const REG = { items: [], sel: null, busy: false };
function regItem(id) { return REG.items.find(x => x.id === id); }
function vRegister() {
  const it = regItem(REG.sel);
  let h = pageHead(t('register'), '', `<button class="btn" data-act="clearDone">${t('clearDone')}</button><button class="btn ed" data-act="newInv">✎ ${t('manualEntry')}</button>`);
  h += `<label class="drop" id="drop"><input type="file" id="regFiles" multiple accept=".pdf,image/*,.xlsx,.xls" style="display:none"><div style="font-size:26px">⤒</div><b>${t('dropHere')}</b><div style="font-size:12px;margin-top:4px">${t('dropSub')}</div></label>`;
  if (!REG.items.length) return h;
  const stTxt = x => x.status === 'parsing' ? `<span class="spin"></span> ${t(x.phase === 'ocr' ? 'ocr' : 'parsing')}` : x.status === 'ready' ? `<span class="b open">${t('ready')}</span>` : x.status === 'saved' ? `<span class="b paid">${t('saved')}</span>` : x.status === 'skipped' ? `<span class="b ic">${t('skipped')}</span>` : `<span class="b overdue">${t('failed')}</span>`;
  h += `<div class="reg"><div class="card queue">${REG.items.map(x => `<div class="qi ${x.id === REG.sel ? 'on' : ''}" data-act="regSel" data-id="${x.id}"><div class="fn" title="${esc(x.file.name)}">${esc(x.file.name)}</div><div class="st">${stTxt(x)} ${x.fields.vendorId ? `<span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(vName(x.fields.vendorId))}</span>` : ''}</div></div>`).join('')}</div>`;
  if (it) {
    const isImg = /^image\//.test(it.file.type), isXl = /\.xlsx?$/i.test(it.file.name);
    if (isXl) { if (it.xlHtml == null) { it.xlHtml = ''; it.file.arrayBuffer().then(b => { const wb = XLSX.read(b, { type: 'array' }); it.xlHtml = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]], { header: '', footer: '' }); if (location.hash === '#register' && REG.sel === it.id) render(); }); } }
    const imgs = isImg ? [it.url] : (it.pageImgs || []);
    if (isXl) { h += `<div class="card preview"><div class="imgwrap" style="align-items:stretch;background:#fff"><div class="xlprev" style="font-size:11px">${it.xlHtml || '<div class="empty"><span class="spin"></span></div>'}</div></div></div><div class="card regform"><div class="card-b">${regForm(it)}</div></div></div>`; return h; }
    h += `<div class="card preview"><div class="imgwrap"><div class="pv-bar"><button class="btn sm" data-act="regOpen">↗ ${LANG === 'ko' ? '새 창에서 열기' : 'Open in new tab'}</button></div>${imgs.length ? imgs.map(s => `<img src="${s}">`).join('') : `<div class="empty"><span class="spin"></span></div>`}${it.pageTotal > imgs.length && !isImg ? `<div class="muted">${t('morePages', { n: it.pageTotal - imgs.length })}</div>` : ''}</div></div>`;
    if (!isImg && !it.pageImgs && !it.pvBusy) { it.pvBusy = true; renderPdfPages(it.file).then(r => { it.pageImgs = r.imgs; it.pageTotal = r.total; }).catch(() => { it.pageImgs = []; }).finally(() => { it.pvBusy = false; if (location.hash === '#register' && REG.sel === it.id) render(); }); }
    h += `<div class="card regform"><div class="card-b">${regForm(it)}</div></div>`;
  }
  h += `</div>`;
  return h;
}
function regForm(it) {
  const f = it.fields, cf = f.conf || {};
  if (it.status === 'parsing') return `<div class="empty"><span class="spin"></span> ${t('parsing')}</div>`;
  const v = vendorById(f.vendorId);
  const dueAuto = v && f.invoiceDate ? calcDue(f.invoiceDate, v.terms) : '';
  const dups = f.vendorId ? findDuplicates(f, null) : [];
  return `${it.error ? `<div class="errbox">${esc(it.error)}</div>` : ''}
  ${it.status === 'saved' ? `<div class="okbox">✓ ${t('saved')}</div>` : ''}
  ${dups.length ? `<div class="warnbox">⚠ ${t('dup', { x: dups.map(i => `${i.invoiceNo || '—'} (${i.invoiceDate}, ${money(i.amount)})`).join(', ') })}</div>` : ''}
  ${!f.vendorId && f.vendorNameRaw ? `<div class="warnbox">${t('newVendorQ')} <b>${esc(f.vendorNameRaw)}</b> <button class="btn sm ed" data-act="regNewVendor">＋ ${t('addVendor')}</button></div>` : ''}
  <div class="form">
    <div class="f full"><label>${conf(cf.vendorId)} ${t('vendor')} *</label><div style="display:flex;gap:6px"><select class="inp rf" data-k="vendorId" style="flex:1">${vendorOptions(f.vendorId, true, true)}</select><button class="btn sm ed" data-act="regNewVendor" title="${t('addVendor')}">＋</button></div></div>
    <div class="f"><label>${conf(cf.invoiceNo)} ${t('invNo')}</label><input class="inp rf" data-k="invoiceNo" value="${esc(f.invoiceNo || '')}"></div>
    <div class="f"><label>${conf(cf.amount)} ${t('amount')} (USD) *</label><input class="inp rf" data-k="amount" type="number" step="0.01" value="${f.amount ?? ''}"></div>
    <div class="f"><label>${conf(cf.invoiceDate)} ${t('invDate')} *</label><input class="inp rf" data-k="invoiceDate" type="date" value="${f.invoiceDate || ''}"></div>
    <div class="f"><label>${conf(cf.dueDate)} ${t('dueDate')}</label><input class="inp rf" data-k="dueDate" type="date" value="${f.dueDate || ''}">${dueAuto ? `<span class="hint">${t('autoDue', { d: dueAuto })} (${termsLabel(v.terms)})</span>` : ''}</div>
    <div class="f full"><label>${conf(cf.memo)} ${t('memo')}</label><input class="inp rf" data-k="memo" value="${esc(f.memo || '')}"></div>
    <div class="f"><label>${conf(cf.product)} ${t('account')}</label><select class="inp rf" data-k="product">${productOptions(f.product)}</select></div>
    <div class="f"><label>${conf(cf.poNo)} ${t('poNo')}</label><input class="inp rf" data-k="poNo" value="${esc(f.poNo || '')}"></div>
    <div class="f"><label>${t('note')}</label><input class="inp rf" data-k="note" value="${esc(f.note || '')}"></div>
  </div>
  ${f.currency && f.currency !== 'USD' ? `<div class="warnbox" style="margin-top:10px">${t('currency')}: ${esc(f.currency)}</div>` : ''}
  <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
    <button class="btn ed" data-act="regAI" ${it.aiBusy ? 'disabled' : ''}>${it.aiBusy ? '<span class="spin"></span>' : '✦'} ${t('aiRead')}</button>
    <span style="flex:1"></span>
    ${it.status !== 'saved' ? `<button class="btn ed" data-act="regSkip">${t('skip')}</button><button class="btn pri ed" data-act="regSave">${t('saveNext')}</button>` : ''}
  </div>
  <div class="muted" style="font-size:11px;margin-top:10px">${t('parsedBy')}: ${it.method === 'ai' ? t('ai') : it.method === 'ocr' ? t('ocrRules') : it.method === 'excel' ? 'Excel' : t('rules')} · ${conf('hi')} ${t('conf_hi')} ${conf('mid')} ${t('conf_mid')} ${conf('lo')} ${t('conf_lo')}</div>
  <details class="raw" style="margin-top:10px"><summary>${t('rawText')}</summary><pre>${esc(it.text || '')}</pre></details>`;
}
function bindRegister() {
  const drop = $('#drop'); if (!drop) return;
  const inp = $('#regFiles');
  inp.onchange = () => { addRegFiles([...inp.files]); inp.value = ''; };
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('on'); };
  drop.ondragleave = () => drop.classList.remove('on');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('on'); addRegFiles([...e.dataTransfer.files]); };
  $$('.rf').forEach(el => el.addEventListener('change', () => {
    const it = regItem(REG.sel); if (!it) return; const k = el.dataset.k;
    it.fields[k] = k === 'amount' ? (el.value === '' ? '' : r2(el.value)) : el.value;
    if (it.fields.conf) it.fields.conf[k] = 'hi';
    if (['vendorId', 'invoiceNo', 'amount', 'invoiceDate'].includes(k)) render();
  }));
}
function addRegFiles(files) {
  files = files.filter(f => /pdf|image/.test(f.type) || /\.(pdf|png|jpe?g|webp|xlsx|xls)$/i.test(f.name));
  for (const file of files) REG.items.push({ id: uid(), file, url: URL.createObjectURL(file), status: 'parsing', fields: { conf: {} }, text: '' });
  if (!REG.sel && REG.items.length) REG.sel = REG.items[0].id;
  render(); processQueue();
}
async function processQueue() {
  if (REG.busy) return; REG.busy = true;
  try {
    for (const it of REG.items) {
      if (it.status !== 'parsing') continue;
      try {
        const ex = await extractText(it.file, ph => { it.phase = ph; if (location.hash === '#register') render(); });
        it.text = ex.text; it.method = ex.method;
        it.fields = parseInvoiceText(ex.text, it.file.name);
        it.status = 'ready';
      } catch (e) { console.error(e); it.status = 'ready'; it.error = (LANG === 'ko' ? '텍스트 추출 실패: ' : 'Text extraction failed: ') + e.message; it.fields = parseInvoiceText('', it.file.name); }
      if (location.hash === '#register') render();
    }
  } finally { REG.busy = false; }
}
ACT.regOpen = () => { const it = regItem(REG.sel); if (it) window.open(it.url, '_blank'); };
ACT.regSel = el => { REG.sel = el.dataset.id; render(); };
ACT.clearDone = () => { REG.items = REG.items.filter(x => { const keep = x.status !== 'saved' && x.status !== 'skipped'; if (!keep) URL.revokeObjectURL(x.url); return keep; }); if (!regItem(REG.sel)) REG.sel = REG.items[0]?.id || null; render(); };
const nextReg = () => { const n = REG.items.find(x => x.status === 'ready' || x.status === 'parsing'); REG.sel = n ? n.id : REG.sel; };
ACT.regSkip = () => { const it = regItem(REG.sel); if (it) it.status = 'skipped'; nextReg(); render(); };
ACT.regAI = async () => {
  const it = regItem(REG.sel); if (!it) return;
  it.aiBusy = true; render();
  try {
    const r = await aiParse(it.file);
    const keepNote = it.fields.note;
    it.fields = { ...it.fields, ...Object.fromEntries(Object.entries(r).filter(([k, v]) => v !== undefined && v !== null && v !== '')), conf: { ...it.fields.conf, ...r.conf } };
    if (!r.vendorId) it.fields.vendorId = it.fields.vendorId || '';
    it.fields.note = keepNote;
    it.method = 'ai'; it.error = ''; toast(t('aiDone'));
  } catch (e) { it.error = 'AI: ' + e.message; }
  it.aiBusy = false; render();
};
ACT.regNewVendor = (el, e) => {
  const it = regItem(REG.sel);
  ACT.newVendor(el, e, { name: it?.fields.vendorNameRaw || '', onSaved: doc => { if (it) { it.fields.vendorId = doc.id; } render(); } });
};
ACT.regSave = async el => {
  const it = regItem(REG.sel); if (!it) return; const f = it.fields;
  if (!f.vendorId || !f.invoiceDate || f.amount === '' || f.amount == null) return toast(t('required'), true);
  const dups = findDuplicates(f, null);
  if (dups.length && !confirm(t('dup', { x: dups.map(i => i.invoiceNo).join(', ') }) + '\n\n' + (LANG === 'ko' ? '그래도 저장할까요?' : 'Save anyway?'))) return;
  const v = vendorById(f.vendorId);
  el.disabled = true;
  try {
    const doc = { vendorId: f.vendorId, invoiceNo: (f.invoiceNo || '').trim(), invoiceDate: f.invoiceDate, dueDate: f.dueDate || '', amount: r2(f.amount), memo: (f.memo || '').trim(), note: (f.note || '').trim(), product: f.product || '', poNo: (f.poNo || '').trim(), fileName: it.file.name, source: 'upload', parsedBy: it.method, needsReview: false, reviewFlags: [], seq: Date.now() };
    var saved = await Store.put('invoices', doc);
  } catch (e) { el.disabled = false; it.error = e.message; render(); return; }
  it.status = 'saved'; it.savedId = saved.id; it.error = '';
  toast(t('savedT')); nextReg(); render();
};

/* ---------- router / nav ---------- */
const NAV = [
  ['dashboard', '◧'], ['sales', '📈'], ['summary', '▤'], ['invoices', '≡'], ['register', '⤒', 'edit'], ['issue', '🧾', 'edit'], ['payments', '💳'], ['vendors', '◎'], ['users', '👥', 'admin', true], ['settings', '⚙'],
];
function renderNav() {
  const cur = (location.hash.slice(1) || 'dashboard').split('/')[0];
  const rv = S.invoices.filter(i => i.needsReview).length;
  $('#navlinks').innerHTML = NAV.filter(([k, ic, need, cloudOnly]) => (!need || can(need)) && (!cloudOnly || CLOUD)).map(([k, ic]) => `<a href="#${k}" class="${cur === k || (cur === 'vendor' && k === 'vendors') ? 'on' : ''}"><span class="ico">${ic}</span><span class="t">${t(k)}</span>${k === 'invoices' && rv ? `<span class="cnt" title="${t('needReview')}">${rv}</span>` : ''}${k === 'users' && typeof ADM !== 'undefined' && ADM.requests.length ? `<span class="cnt">${ADM.requests.length}</span>` : ''}${k === 'register' && REG.items.filter(x => x.status === 'ready').length ? `<span class="cnt" style="background:var(--accent-l);color:var(--accent-d)">${REG.items.filter(x => x.status === 'ready').length}</span>` : ''}</a>`).join('');
  $$('.lang-toggle button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  if (CLOUD) {
    $('#who').innerHTML = AUTH.email ? `<div style="font-weight:600;color:var(--text)">👤 ${esc(AUTH.name)}</div><div style="margin:2px 0 6px"><span class="b ${AUTH.role === 'admin' ? 'overdue' : AUTH.role === 'editor' ? 'open' : 'ic'}">${t('role_' + AUTH.role)}</span></div><button class="btn sm" id="btnOut">${t('signOut')}</button>` : '';
    const bo = $('#btnOut'); if (bo) bo.onclick = e => { e.stopPropagation(); signOut(); };
  } else { const u = Pref.get('user', ''); $('#who').textContent = u ? '👤 ' + u : (LANG === 'ko' ? '👤 이름 설정' : '👤 Set your name'); }
  $('#storeMode').textContent = CLOUD ? t('online') : t('local');
}
function render(keepFocus) {
  const focusId = keepFocus && document.activeElement ? document.activeElement.id : null; const caret = focusId ? document.activeElement.selectionStart : null;
  Object.values(CH).forEach(ch => ch && ch.destroy && ch.destroy()); CH = {};
  const [view, arg] = (location.hash.slice(1) || 'dashboard').split('/');
  renderNav();
  if (CLOUD && AUTH.status !== 'ok') return;
  document.body.classList.toggle('ro', !can('edit')); document.body.classList.toggle('isadm', can('admin'));
  const noPerm = () => `<div class="errbox">${t('noPerm')}</div>`;
  const fn = { dashboard: vDashboard, sales: vSales, summary: vSummary, invoices: vInvoices, register: can('edit') ? vRegister : noPerm, issue: can('edit') ? vIssue : noPerm, payments: vPayments, vendors: vVendors, vendor: () => vVendor(arg), settings: vSettings, users: CLOUD ? vUsers : vDashboard }[view] || vDashboard;
  $('#view').innerHTML = fn();
  bindAsOf(); bindRegister();
  if (focusId && $('#' + focusId)) { const el = $('#' + focusId); el.focus(); try { el.setSelectionRange(caret, caret); } catch { } }
}
function setLang(l) { LANG = l; Pref.set('lang', l); document.documentElement.lang = l; render(); }
const EDIT_ACTS = new Set(['newInv', 'payFor', 'payInv', 'newPay', 'newVendor', 'delInv', 'delPay', 'delVendor', 'regNewVendor', 'regSave', 'regAI', 'dep50', 'issSave', 'addUser', 'editUser', 'delUser', 'approveReq', 'dismissReq']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !ACT[el.dataset.act]) return;
  e.preventDefault();
  const a = el.dataset.act;
  if (EDIT_ACTS.has(a) && !can(['addUser', 'editUser', 'delUser', 'approveReq', 'dismissReq'].includes(a) ? 'admin' : 'edit')) return toast(t('noPerm'), true);
  ACT[a](el, e);
});
window.addEventListener('unhandledrejection', e => { const m = (e.reason && (e.reason.message || e.reason.code)) || String(e.reason); if (/permission/i.test(m)) toast(t('noPerm'), true); else toast(m, true); });
$$('.lang-toggle button').forEach(b => b.onclick = () => setLang(b.dataset.lang));
$('#who').onclick = () => { if (CLOUD) return; const n = prompt(t('yourName'), Pref.get('user', '')); if (n !== null) { Pref.set('user', n.trim()); renderNav(); } };
window.addEventListener('hashchange', () => { closeModal(); if (!location.hash.startsWith('#vendor/')) UI.vendorTab = 'ledger'; window.scrollTo(0, 0); render(); });

(async function init() {
  document.documentElement.lang = LANG;
  if (CLOUD) return cloudBoot();
  try { await Store.init(); }
  catch (e) { $('#view').innerHTML = `<div class="errbox">${t('storageErr')}: ${esc(e.message)}</div>`; return; }
  render();
  if (Pref.get('lang', null) === null) langPicker();
})();
function langPicker() {
  openModal({ title: '언어 선택 · Language', body: `<div style="text-align:center;padding:6px 0 4px"><div style="font-size:15px;font-weight:600">사용할 언어를 선택하세요<br>Choose your language</div>
    <div style="display:flex;gap:12px;justify-content:center;margin:20px 0 14px"><button class="btn langpick" data-lang="ko" style="padding:16px 28px;font-size:15px">🇰🇷 한국어</button><button class="btn langpick" data-lang="en" style="padding:16px 28px;font-size:15px">🇺🇸 English</button></div>
    <div class="muted" style="font-size:12px">왼쪽 위 토글이나 설정에서 언제든 바꿀 수 있습니다.<br>You can change it anytime from the toggle at the top left or in Settings.</div></div>` });
  $$('.langpick').forEach(b => b.onclick = () => { closeModal(); setLang(b.dataset.lang); });
}
