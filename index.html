<style>
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f9fafb; --line:#e5e7eb; --line-2:#eef0f3;
  --text:#111827; --text-2:#4b5563; --muted:#9ca3af;
  --accent:#0f8a7e; --accent-d:#0b6b62; --accent-l:#e3f4f1;
  --s1:#2a78d6; --s2:#0f9b6c;
  --good:#15803d; --good-l:#e7f6ec; --warn:#b45309; --warn-l:#fef3e2; --bad:#c53030; --bad-l:#fdecec; --info-l:#eef2ff;
  --ag0:#2a78d6; --ag1:#f2a27f; --ag2:#eb6834; --ag3:#c4421a; --ag4:#7f2410;
  --r:10px; --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.45 Inter,"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
.nav{width:220px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.brand-t{font-weight:700;letter-spacing:.02em}
.brand-s{font-size:12px;color:var(--text-2)}
#navlinks{display:flex;flex-direction:column;padding:6px 10px;gap:2px;flex:1}
#navlinks a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--text-2);text-decoration:none;font-weight:500}
#navlinks a:hover{background:var(--surface-2);color:var(--text)}
#navlinks a.on{background:var(--accent-l);color:var(--accent-d)}
#navlinks a .ico{width:18px;text-align:center;opacity:.85}
#navlinks a .cnt{margin-left:auto;background:var(--bad-l);color:var(--bad);font-size:11px;border-radius:10px;padding:0 7px;font-weight:600}
.nav-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lang-top{padding:0 14px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.lang-lbl{display:block;font-size:11px;color:var(--muted);margin:0 2px 5px}
.lang-toggle{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px}
.lang-toggle button{flex:1;border:0;background:none;padding:5px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--text-2)}
.lang-toggle button.on{background:#fff;color:var(--text);box-shadow:var(--shadow);font-weight:600}
.who{font-size:12px;color:var(--text-2);cursor:pointer}
.store-mode{font-size:11px;color:var(--muted)}
main{flex:1;min-width:0;padding:22px 28px 60px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.page-h h1{font-size:20px;margin:0;font-weight:700}
.page-h .sub{color:var(--text-2);font-size:13px}
.page-h .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 16px 0}
.card-h h3{margin:0;font-size:14px;font-weight:600}
.card-h .sp{flex:1}
.card-b{padding:14px 16px 16px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px;cursor:pointer}
.kpi:hover{border-color:#cfd6df}
.kpi .l{font-size:12px;color:var(--text-2);font-weight:500}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.bad .v{color:var(--bad)} .kpi.warn .v{color:var(--warn)}
.row2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-bottom:16px}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media (max-width:1300px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media (max-width:1000px){.row2,.row3{grid-template-columns:1fr}.nav{width:64px}.brand div:last-child,#navlinks a span.t,.nav-foot .who,.store-mode{display:none}.lang-toggle{flex-direction:column}.lang-lbl{display:none}.lang-top{padding:0 6px 10px}}
/* aging bar */
.agebar{display:flex;height:28px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface)}
.agebar div{height:100%;min-width:2px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px}
.legend .it{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-2);cursor:pointer}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
/* hbar list */
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:150px 1fr 100px;align-items:center;gap:10px;font-size:13px;cursor:pointer;padding:2px 0}
.hb:hover .nm{color:var(--accent-d)}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.hb .tr{height:14px;background:var(--surface-2);border-radius:4px;position:relative;overflow:hidden}
.hb .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
.hb .vv{text-align:right;font-variant-numeric:tabular-nums;color:var(--text-2)}
/* tables */
.tbl-wrap{overflow:auto;max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;color:var(--text-2);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle;white-space:nowrap}
table.t tr:hover td{background:#fafbfc}
table.t tr.click{cursor:pointer}
table.t .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
table.t td.muted,.muted{color:var(--muted)}
table.t td.wrap{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-scroll{max-height:calc(100vh - 230px);overflow:auto}
/* badges */
.b{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.b.paid{background:var(--good-l);color:var(--good)}
.b.open{background:var(--accent-l);color:var(--accent-d)}
.b.partial{background:var(--info-l);color:#4338ca}
.b.overdue{background:var(--bad-l);color:var(--bad)}
.b.review{background:var(--warn-l);color:var(--warn)}
.b.ic{background:#f3f4f6;color:#374151}
/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{background:var(--accent-d)}
.btn.danger{color:var(--bad);border-color:#f3c4c4}
.btn.danger:hover{background:var(--bad-l)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.inp,select.inp,textarea.inp{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;min-width:0}
.inp:focus{outline:2px solid var(--accent-l);border-color:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters .inp{height:34px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2);cursor:pointer;user-select:none}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 14px}
.form .f{display:flex;flex-direction:column;gap:5px;min-width:0}
.form .inp{width:100%}
.form .f.full{grid-column:1/-1}
.form label{font-size:12px;color:var(--text-2);font-weight:500;display:flex;align-items:center;gap:6px}
.form .hint{font-size:11px;color:var(--muted)}
.conf{width:8px;height:8px;border-radius:50%;display:inline-block}
.conf.hi{background:#16a34a}.conf.mid{background:#eab308}.conf.lo{background:#d1d5db}
/* modal */
.mbg{position:fixed;inset:0;background:rgba(17,24,39,.35);display:flex;align-items:flex-start;justify-content:center;padding:50px 16px;z-index:50;overflow:auto}
.modal{background:#fff;border-radius:12px;width:100%;max-width:640px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{max-width:900px}
.modal-h{display:flex;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:16px}
.modal-h .x{margin-left:auto;border:0;background:none;font-size:20px;cursor:pointer;color:var(--muted)}
.modal-b{padding:18px 20px}
.modal-f{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 12px 12px}
.modal-f .sp{flex:1}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:#111827;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 8px 20px rgba(0,0,0,.2)}
#toast div.err{background:var(--bad)}
/* register */
label.drop{display:block}
.drop{border:2px dashed #cdd5df;border-radius:12px;padding:28px;text-align:center;color:var(--text-2);background:#fff;cursor:pointer;transition:.15s}
.drop.on,.drop:hover{border-color:var(--accent);background:var(--accent-l)}
.drop b{color:var(--text)}
.reg{display:grid;grid-template-columns:240px 1fr 420px;gap:14px;margin-top:14px;align-items:start}
@media (max-width:1300px){.reg{grid-template-columns:200px 1fr}.reg .regform{grid-column:1/-1}}
.queue{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 260px);overflow:auto;padding:8px}
.qi{padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;font-size:12px}
.qi:hover{background:var(--surface-2)}
.qi.on{border-color:var(--accent);background:var(--accent-l)}
.qi .fn{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text)}
.qi .st{color:var(--text-2);margin-top:2px;display:flex;gap:6px;align-items:center}
.preview{height:calc(100vh - 230px);min-height:480px;overflow:hidden;display:flex}
.preview .imgwrap{flex:1;border-radius:var(--r);background:#eef0f3;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.preview img{max-width:100%;box-shadow:var(--shadow);background:#fff}
.xlprev table{border-collapse:collapse}.xlprev td{border:1px solid #e5e7eb;padding:2px 5px;white-space:nowrap}
.preview .pv-bar{display:flex;gap:6px;position:sticky;top:0;align-self:flex-end}
.empty{padding:40px;text-align:center;color:var(--muted)}
.warnbox{background:var(--warn-l);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.errbox{background:var(--bad-l);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.okbox{background:var(--good-l);color:var(--good);border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px}
details.raw summary{cursor:pointer;color:var(--text-2);font-size:12px}
details.raw pre{white-space:pre-wrap;font-size:11px;background:var(--surface-2);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
.spin{width:12px;height:12px;border:2px solid #cbd5e1;border-top-color:var(--accent);border-radius:50%;display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vhead{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--accent-d);border-color:var(--accent)}
.alloc td .inp{width:110px;text-align:right;padding:4px 8px}
.pill-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--text-2);margin-top:10px}
.pill-sum b{color:var(--text);font-variant-numeric:tabular-nums}
.link{color:var(--accent-d);cursor:pointer;text-decoration:none}
.link:hover{text-decoration:underline}
.set-sec{margin-bottom:16px}
.set-sec .card-b p{margin:0 0 10px;color:var(--text-2);font-size:13px}
.right{text-align:right}
.chart-box{position:relative;height:260px}
/* roles */
body.ro .ed,.mbg.ro .ed{display:none!important}
body:not(.isadm) .adm{display:none!important}
/* login gate */
#gate{position:fixed;inset:0;background:var(--bg);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(16,24,40,.08);padding:34px 30px;max-width:420px;width:100%;text-align:center}
.gate-card h2{margin:0 0 8px;font-size:19px}
.gate-card p{color:var(--text-2);font-size:13px;margin:0 0 20px}

</style>
</head>
<body>
<div id="app">
  <aside class="nav">
    <div class="brand"><div class="logo">AR</div><div><div class="brand-t">JNFAM</div><div class="brand-s">Accounts Receivable</div></div></div>
    <div class="lang-top"><span class="lang-lbl" id="langLbl">언어 · Language</span><div class="lang-toggle"><button data-lang="ko">한국어</button><button data-lang="en">English</button></div></div>
    <nav id="navlinks"></nav>
    <div class="nav-foot">
      <div class="who" id="who"></div>
      <div class="store-mode" id="storeMode"></div>
    </div>
  </aside>
  <main id="view"></main>
</div>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
   JNFAM AR Manager — core (utils, i18n, data store, AP calculations)
   Data layer is behind `Store` so it can be swapped from IndexedDB
   (local stage) to Firebase Firestore/Storage (online stage) later.
   ===================================================================== */

/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const r2 = n => Math.round((+n || 0) * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => d ? `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}` : '';
const todayStr = () => ymd(new Date());
const toDate = s => { if (!s) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = toDate(s); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((toDate(b) - toDate(a)) / 864e5);
const validYMD = (y, m, d) => { const dt = new Date(y, m - 1, d); return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d; };
const money = (n, dec = 2) => {
  n = +n || 0; const neg = n < 0;
  const s = Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
  return (neg ? '-$' : '$') + s;
};
const moneyK = n => { n = +n || 0; const a = Math.abs(n); const s = a >= 1e6 ? (a / 1e6).toFixed(2) + 'M' : a >= 1e4 ? (a / 1e3).toFixed(1) + 'K' : a.toLocaleString('en-US', { maximumFractionDigits: 0 }); return (n < 0 ? '-$' : '$') + s; };
const normKey = s => String(s || '').toLowerCase().replace(/[^a-z0-9가-힣]+/g, '');
const normWords = s => ' ' + String(s || '').toLowerCase().replace(/[^a-z0-9가-힣]+/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
const fmtD = s => s || '';
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function toast(msg, err) { const d = document.createElement('div'); d.textContent = msg; if (err) d.className = 'err'; $('#toast').appendChild(d); setTimeout(() => d.remove(), err ? 5000 : 2600); }
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
const fileToB64 = blob => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(blob); });

/* ---------- i18n ---------- */
const L = {
  dashboard: ['Dashboard', '대시보드'], summary: ['AR Aging', 'AR 현황(Aging)'], invoices: ['Invoices', '인보이스'], register: ['Register Invoice', '인보이스 등록'],
  payments: ['Receipts', '입금 내역'], vendors: ['Customers', '고객'], settings: ['Settings', '설정'],
  asOf: ['As of', '기준일'], inclIC: ['Include other receivables', '기타 미수금 포함'], totalAP: ['Total AR Outstanding', '총 미수금'],
  overdue: ['Overdue', '연체'], due7: ['Due in 7 days', '7일 내 입금 예정'], due30: ['Due in 30 days', '30일 내 입금 예정'], paidMTD: ['Received this month', '이번 달 입금액'],
  needReview: ['Needs review', '검토 필요'], invoicesN: ['{n} invoices', '{n}건'], agingTitle: ['Aging (by days past due)', 'Aging (연체일 기준)'],
  current: ['Current', 'Current'], b1: ['1–30', '1–30'], b2: ['31–60', '31–60'], b3: ['61–90', '61–90'], b4: ['> 90', '> 90'], total: ['Total', '합계'],
  topVendors: ['Top customers by balance', '고객별 미수 잔액'], monthly: ['Monthly invoiced vs received', '월별 청구 vs 입금'],
  invoiced: ['Invoiced', '청구'], paid: ['Received', '입금'], byAccount: ['Invoiced by product (YTD)', '품목별 청구액 (연누계)'],

/* ---------- data store (IndexedDB adapter) ----------
   Interface used by the app (keep identical for the Firebase adapter):
     init() -> loads all collections into S
     put(col, doc) / putMany(col, docs) / del(col, id) / clear()
     putFile(id, blob, meta) / getFile(id) / delFile(id)

const COLS = ['vendors', 'invoices', 'payments', 'meta'];
const S = { vendors: [], invoices: [], payments: [], meta: [] };
const LocalStore = {
  db: null, mode: 'local',
  open() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open('jnfam-ar', 1);
      rq.onupgradeneeded = () => { const db = rq.result; for (const c of [...COLS, 'files']) if (!db.objectStoreNames.contains(c)) db.createObjectStore(c, { keyPath: 'id' }); };
      rq.onsuccess = () => { this.db = rq.result; res(); };
      rq.onerror = () => rej(rq.error);
    });
  },
  tx(col, mode = 'readonly') { return this.db.transaction(col, mode).objectStore(col); },
  req(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async init() { await this.open(); for (const c of COLS) S[c] = await this.req(this.tx(c).getAll()); },
  stamp(doc) { doc.updatedAt = new Date().toISOString(); doc.updatedBy = currentUserName(); if (!doc.createdAt) { doc.createdAt = doc.updatedAt; doc.createdBy = doc.updatedBy; } return doc; },
  async put(col, doc, noStamp) {
    if (!doc.id) doc.id = uid(); if (!noStamp) this.stamp(doc);
    await this.req(this.tx(col, 'readwrite').put(doc));
    const i = S[col].findIndex(x => x.id === doc.id); if (i >= 0) S[col][i] = doc; else S[col].push(doc);
    return doc;
  },
  async putMany(col, docs) {
    await new Promise((res, rej) => { const tx = this.db.transaction(col, 'readwrite'); const st = tx.objectStore(col); docs.forEach(d => { if (!d.id) d.id = uid(); st.put(d); }); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    const map = new Map(S[col].map(x => [x.id, x])); docs.forEach(d => map.set(d.id, d)); S[col] = [...map.values()];
  },
  async del(col, id) { await this.req(this.tx(col, 'readwrite').delete(id)); S[col] = S[col].filter(x => x.id !== id); },
  async clear(withFiles = true) { for (const c of [...COLS, ...(withFiles ? ['files'] : [])]) { await this.req(this.tx(c, 'readwrite').clear()); if (S[c]) S[c] = []; } },
  async putFile(id, blob, meta = {}) { await this.req(this.tx('files', 'readwrite').put({ id, blob, ...meta })); return id; },
  async getFile(id) { return id ? this.req(this.tx('files').get(id)) : null; },
  async delFile(id) { if (id) await this.req(this.tx('files', 'readwrite').delete(id)); },
  async allFiles() { return this.req(this.tx('files').getAll()); },
};

/* ---------- terms / due date ---------- */
function termsLabel(tr) {

  if (!invDate) return '';

  if (tr.type === 'receipt') return invDate;

/* ---------- AR engine ----------
   compute({asOf, inclIC}) -> per-invoice open balances, per-vendor balances,
   aging buckets. Receipts dated after asOf are ignored; invoices dated
   after asOf are ignored. Unapplied credit (receipt + adjustment - allocations)
   is applied FIFO to the customer's oldest open invoices for aging.            */
const BUCKETS = ['current', 'b1', 'b2', 'b3', 'b4'];
const bucketOf = dpd => dpd <= 0 ? 0 : dpd <= 30 ? 1 : dpd <= 60 ? 2 : dpd <= 90 ? 3 : 4;

function payUnapplied(p) { return r2((+p.amount || 0) + (+p.fee || 0) - (p.allocations || []).reduce((s, a) => s + (+a.amount || 0), 0)); }
function compute(opt = {}) {
  const asOf = opt.asOf || todayStr();
  const inclIC = opt.inclIC !== false;
  const vOK = id => { const v = vendorById(id); return inclIC || !isIC(v); };
  const applied = new Map(); const payByInv = new Map(); const unappliedByV = new Map();
  for (const p of S.payments) {
    if (p.date && p.date > asOf) continue;
    for (const a of p.allocations || []) { applied.set(a.invoiceId, r2((applied.get(a.invoiceId) || 0) + (+a.amount || 0))); if (!payByInv.has(a.invoiceId)) payByInv.set(a.invoiceId, []); payByInv.get(a.invoiceId).push(p); }
    const u = payUnapplied(p); if (Math.abs(u) > 0.004) unappliedByV.set(p.vendorId, r2((unappliedByV.get(p.vendorId) || 0) + u));
  }
  const inv = new Map(); const byV = new Map();
  const vRow = id => { if (!byV.has(id)) byV.set(id, { vendorId: id, invoiced: 0, paid: 0, balance: 0, aging: [0, 0, 0, 0, 0], open: 0, credit: 0, overdue: 0, lastInv: '' }); return byV.get(id); };
  const sorted = S.invoices.filter(i => (!i.invoiceDate || i.invoiceDate <= asOf)).sort((a, b) => (a.invoiceDate || '').localeCompare(b.invoiceDate || '') || (a.seq || 0) - (b.seq || 0));
  for (const i of sorted) {
    const ap = applied.get(i.id) || 0; const open = r2((+i.amount || 0) - ap); const due = invDue(i);
    const dpd = due ? daysBetween(due, asOf) : 0;
    inv.set(i.id, { applied: ap, open, due, dpd, agingOpen: open, payments: payByInv.get(i.id) || [] });
    const r = vRow(i.vendorId); r.invoiced = r2(r.invoiced + (+i.amount || 0)); if (i.invoiceDate > r.lastInv) r.lastInv = i.invoiceDate;
  }

    if (c > 0) for (const i of sorted) { if (i.vendorId !== vid) continue; const x = inv.get(i.id); if (x.agingOpen <= 0) continue; const take = Math.min(c, x.agingOpen); x.agingOpen = r2(x.agingOpen - take); c = r2(c - take); if (c <= 0) break; }

  { m: /q\s*-?cell/i, aliases: ['Hanwha Qcells', 'Qcells', 'Q CELLS', 'Q-CELLS', 'Hanwha Q'], rx: '' },
  { m: /jefferson|csi/i, aliases: ['Jefferson', 'CSI'], rx: '' },

async function importWorkbook(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellFormula: true, cellNF: true });
  const val = (ws, a) => {
    const c = ws[a]; if (!c || c.t === 'e' || c.t === 'z') return null;
    if (c.t === 'n' && c.z && XLSX.SSF.is_date(c.z)) { const p = XLSX.SSF.parse_date_code(c.v); return { date: `${p.y}-${pad(p.m)}-${pad(p.d)}` }; }
    if (c.t === 'd') { return { date: ymd(new Date(c.v)) }; }
    return c.v;
  };
  const num = v => { if (v == null) return null; if (typeof v === 'number') return v; if (typeof v === 'object') return null; const s = String(v).replace(/[$,\s]/g, ''); return /^-?\d+(\.\d+)?$/.test(s) ? +s : null; };
  const str = v => v == null ? '' : typeof v === 'object' ? (v.date || '') : String(v).trim();
  const lastRow = ws => ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']).e.r + 1 : 0;
  const lastCol = ws => ws['!ref'] ? XLSX.utils.decode_range(ws['!ref']).e.c : 0;
  /* value of a cell, or of the top-left cell when it sits inside a merged range (e.g. one memo for two invoice rows) */
  const valM = (ws, a) => { const v = val(ws, a); if (v != null) return v; const p = XLSX.utils.decode_cell(a); const m = (ws['!merges'] || []).find(m => p.r >= m.s.r && p.r <= m.e.r && p.c >= m.s.c && p.c <= m.e.c); return m ? val(ws, XLSX.utils.encode_cell(m.s)) : null; };
  const colL = i => XLSX.utils.encode_col(i);

  /* --- AR total (customer list) --- */
  const totName = wb.SheetNames.find(n => /ar\s*total/i.test(n)) || wb.SheetNames[0];
  const totWs = wb.Sheets[totName];
  const sheetTotalRow = {};
  // totals row = "TOTAL" in A/B, or a "Balance" label next to the sums (Qcell sheet has no TOTAL text)
  for (const n of wb.SheetNames) { if (n === totName) continue; const ws = wb.Sheets[n]; for (let r = 3; r <= lastRow(ws); r++) if (/^total$/i.test(str(val(ws, 'A' + r))) || /^total$/i.test(str(val(ws, 'B' + r))) || ['C', 'D', 'E', 'F', 'G', 'H'].some(c => /^balance$/i.test(str(val(ws, c + r))))) { sheetTotalRow[n] = r; break; } }
  const custRows = [], taken = new Set();
  for (let r = 2; r <= lastRow(totWs); r++) {
    if (/total/i.test(str(val(totWs, 'A' + r)))) break;
    const name = str(val(totWs, 'B' + r)); if (!name) continue;
    const f = ((totWs['C' + r] && totWs['C' + r].f) || '').replace(/^\+/, '');
    const m = f.match(/^'?([^'!]+)'?!\$?[A-Z]+\$?(\d+)$/);
    let sheet = m && wb.Sheets[m[1]] && !taken.has(m[1]) ? m[1] : '';
    if (!sheet) { const s2 = wb.SheetNames.find(n => n !== totName && !taken.has(n) && normKey(n) === normKey(name)); if (s2) sheet = s2; }
    if (sheet) taken.add(sheet);
    custRows.push({ name, sheet });
  }
  for (const n of wb.SheetNames) if (n !== totName && sheetTotalRow[n] && !taken.has(n)) custRows.push({ name: n, sheet: n });

  const defTerms = shared('defTerms', 30);
  const vendors = custRows.map((r, i) => {
    const hint = KNOWN_CUSTOMER_HINTS.find(h => h.m.test(r.name) || h.m.test(r.sheet));
    const aliases = new Set(hint ? hint.aliases : []);
    if (r.sheet && normKey(r.sheet) !== normKey(r.name)) aliases.add(r.sheet);
    return { id: 'v_' + uid(), name: r.name, sheet: r.sheet, terms: { type: 'net', days: defTerms }, notes: '', aliases: [...aliases], invRegex: hint ? hint.rx : '', group: hint && hint.other ? 'intercompany' : 'operating', active: true, order: i };
  });

  /* --- customer sheets --- */
  const invoices = [], payments = [], report = [];
  let seq = 0;
  for (const v of vendors) {
    if (!v.sheet) continue;
    const ws = wb.Sheets[v.sheet]; const tr = sheetTotalRow[v.sheet]; if (!tr) continue;
    // header map (row 1)
    const H = {}; const lc = lastCol(ws);
    for (let c = 0; c <= Math.min(lc, 15); c++) {
      const h = str(val(ws, colL(c) + 1)).toLowerCase(); if (!h) continue;
      if (/invoice/.test(h) && H.inv == null) H.inv = c; else if (/amount/.test(h) && H.amt == null) H.amt = c; else if (/received/.test(h) && H.rec == null) H.rec = c;
      else if (/interest/.test(h) && H.int == null) H.int = c; else if (/date/.test(h) && H.date == null) H.date = c; else if (/memo/.test(h) && H.memo == null) H.memo = c;
    }
    if (H.inv == null) H.inv = 0; if (H.amt == null) H.amt = 2; if (H.rec == null) H.rec = H.amt + 1; if (H.date == null) H.date = H.rec + 1; if (H.memo == null) H.memo = H.date + 1;
    // invoice-number column: header is merged over the row-number column → use the next column if this one holds 1,2,3…
    let numeric = 0, cnt = 0; for (let r = 3; r < tr; r++) { const x = val(ws, colL(H.inv) + r); if (x != null) { cnt++; if (typeof x === 'number') numeric++; } }
    if (cnt && numeric / cnt > 0.6) H.inv += 1;
    const maxMapped = Math.max(...Object.values(H));
    const noteCols = []; for (let c = maxMapped + 1; c <= Math.min(lc, maxMapped + 8); c++) noteCols.push(colL(c));
    const cell = (k, r) => val(ws, colL(H[k]) + r);
    let sumC = 0, sumD = 0;
    const vInv = [], vPay = [];
    let prevDate = '', lastInv = null;
    for (let r = 3; r < tr; r++) {
      const B = str(cell('inv', r)), C = num(cell('amt', r)), D = num(cell('rec', r)), E = cell('date', r);
      const memo = str(valM(ws, colL(H.memo) + r));
      const interest = H.int != null ? num(cell('int', r)) : null;
      const notes = noteCols.map(c => val(ws, c + r)).filter(x => typeof x === 'string' && x.trim()).map(x => x.trim().replace(/^\*/, '')).join(' · ');
      const rowDate = E && typeof E === 'object' ? E.date : '';

      const amtF = (ws[colL(H.amt) + r] && ws[colL(H.amt) + r].f) || ''; const half = /\/\s*2\s*$/.test(amtF);

      let inv = null;
      if (C) {
        if (!B && lastInv) {           // continuation line of the invoice above (merged invoice-no cell)
          inv = lastInv; inv.amount = r2(inv.amount + C); inv.lines.push({ memo, amount: r2(C), product: productOf(memo) });
          inv.memo = inv.lines.map(l => l.memo).filter(Boolean).join(' + ');
          if (notes) inv.note = [inv.note, notes].filter(Boolean).join(' · ');
        } else {
          const flags = [];
          let date = invNoDate(B);
          if (!date && rowDate) { date = rowDate; flags.push('dateFromPayment'); }
          if (!date && prevDate) { date = prevDate; flags.push('dateFromPrev'); }
          if (!date) flags.push('noDate');
          if (!B) flags.push('noInvoiceNo');
          if (half) flags.push('deposit50');
          if (date) prevDate = date;
          const noteAll = [notes, interest ? `Interest ${money(interest)}` : ''].filter(Boolean).join(' · ');
          inv = { id: 'i_' + uid(), vendorId: v.id, invoiceNo: B, srcRef: B, invoiceDate: date, dueDate: '', amount: r2(C), memo, note: noteAll, poNo: '', interest: interest ? r2(interest) : 0,
            salesAmount: half ? r2(C * 2) : null, product: productOf(memo + ' ' + B) || (v.group === 'intercompany' ? 'Duty refund' : ''), lines: [{ memo, amount: r2(C), product: productOf(memo + ' ' + B) }],
            needsReview: flags.length > 0, reviewFlags: flags, seq: seq++, source: 'excel', _lump: new Set() };
          vInv.push(inv); lastInv = inv;
        }
        if (!D && rowDate) inv._lump.add(rowDate);   // received together with another row's receipt
      }
      if (D) {
        const p = { id: 'p_' + uid(), vendorId: v.id, date: rowDate, amount: r2(D), fee: 0, method: '', ref: '', memo: C ? '' : (B || memo), allocations: [], source: 'excel', reviewFlags: rowDate ? [] : ['noDate'], _inv: C ? inv : null, _row: r };
        vPay.push(p);
      }
    }
    // allocation: (1) own row, (2) rows marked with the same receipt date, (3) oldest open invoices dated on/before the receipt
    const open = new Map(vInv.map(i => [i.id, i.amount]));
    const rem = p => r2(p.amount - p.allocations.reduce((s, a) => s + a.amount, 0));
    const give = (p, i) => { const a = r2(Math.min(rem(p), open.get(i.id))); if (a <= 0.004) return; const ex = p.allocations.find(x => x.invoiceId === i.id); if (ex) ex.amount = r2(ex.amount + a); else p.allocations.push({ invoiceId: i.id, amount: a }); open.set(i.id, r2(open.get(i.id) - a)); };
    for (const p of vPay) if (p._inv) give(p, p._inv);
    for (const p of vPay) if (rem(p) > 0.004 && p.date) { for (const i of vInv) { if (rem(p) <= 0.004) break; if (i._lump.has(p.date) && open.get(i.id) > 0.004) { give(p, i); p._lumped = true; } } }
    const byDate = [...vInv].sort((a, b) => (a.invoiceDate || '').localeCompare(b.invoiceDate || '') || a.seq - b.seq);
    for (const p of vPay) if (rem(p) > 0.004) { for (const i of byDate) { if (rem(p) <= 0.004) break; if (p.date && i.invoiceDate && i.invoiceDate > p.date) continue; if (open.get(i.id) > 0.004) { give(p, i); p._lumped = true; } } }
    for (const p of vPay) {
      if (p._lumped) { p.reviewFlags.push('lump'); p.memo = [p.memo, LANG === 'ko' ? '엑셀 일괄 입금 → 자동 배분' : 'Excel lump receipt → auto-allocated'].filter(Boolean).join(' · '); }
      const u = rem(p); if (u > 0.004 && p.allocations.length && (u > 1 || p._lumped)) p.reviewFlags.push('unapplied');

      const o = open.get(i.id);
      if (o > 0.004 && o < 1 && i.amount > 1) { i.reviewFlags.push('cent'); i.needsReview = true; }
      if (i.lines.length < 2) delete i.lines;
      delete i._lump; invoices.push(i);
    }
    report.push({ vendorId: v.id, name: v.name, sheet: v.sheet, excelBal: r2(sumC - sumD) });
  }
  return { vendors, invoices, payments, report };
}

async function runImport(file) {
  const res = await importWorkbook(file);
  await Store.clear(true);
  await Store.putMany('vendors', res.vendors.map(v => Store.stamp(v)));
  await Store.putMany('invoices', res.invoices.map(v => Store.stamp(v)));
  await Store.putMany('payments', res.payments.map(v => Store.stamp(v)));
  await setShared('importInfo', { file: file.name, at: new Date().toISOString(), by: currentUserName() });
  const c = compute({ asOf: '2999-12-31', inclIC: true });
  res.report.forEach(r => { const b = c.byV.get(r.vendorId); r.appBal = b ? b.balance : 0; r.diff = r2(r.appBal - r.excelBal); r.credit = b ? r2(b.credit || 0) : 0; });
  return res;
}

/* =====================================================================
   Invoice parsing — pdf.js text → (OCR fallback) → rule extraction;
   optional Claude API re-read.
   ===================================================================== */
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const TESS_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
let _pdfReady = null, _tessReady = null, _tessWorker = null;
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('load ' + src)); document.head.appendChild(s); }); }
async function pdfReady() {

    if (!window.pdfjsLib) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
    try { const code = await (await fetch(PDFJS_WORKER)).text(); pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code], { type: 'text/javascript' })); }
    catch { pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER; }
  })();
  return _pdfReady;
}
async function ocrImage(src, onStatus) {
  if (!_tessReady) _tessReady = loadScript(TESS_URL);
  await _tessReady;
  if (!_tessWorker) { onStatus && onStatus('ocr'); _tessWorker = await Tesseract.createWorker('eng'); }

/* rebuild reading-order lines from pdf.js text items */
function itemsToLines(items) {
  const rows = [];
  for (const it of items) {
    if (!it.str || !it.str.trim()) continue;
    const x = it.transform[4], y = it.transform[5], h = Math.abs(it.transform[3]) || 8;
    let row = rows.find(r => Math.abs(r.y - y) < Math.max(2.5, h * 0.45));
    if (!row) { row = { y, h, items: [] }; rows.push(row); }
    row.items.push({ x, w: it.width || it.str.length * h * 0.5, s: it.str });
  }
  rows.sort((a, b) => b.y - a.y);
  return rows.map(r => {
    r.items.sort((a, b) => a.x - b.x);
    let line = '', end = null;
    for (const it of r.items) { if (end !== null) { const gap = it.x - end; line += gap > r.h * 1.5 ? '   ' : gap > r.h * 0.15 ? ' ' : ''; } line += it.s; end = it.x + it.w; }
    return line.trim();

}
async function extractText(file, onStatus) {
  if (/\.xlsx?$/i.test(file.name)) return { text: await xlsxToText(file), method: 'excel', pages: 1 };
  const isPdf = /pdf$/i.test(file.type) || /\.pdf$/i.test(file.name);
  if (isPdf) {
    await pdfReady();
    const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
    const n = Math.min(pdf.numPages, 4); let lines = [];
    for (let p = 1; p <= n; p++) { const page = await pdf.getPage(p); const tc = await page.getTextContent(); lines.push(...itemsToLines(tc.items)); if (p < n) lines.push('---'); }
    let text = lines.join('\n');
    if (text.replace(/\s|-/g, '').length >= 40 && !looksGarbled(text)) return { text, method: 'rules', pages: pdf.numPages };
    // scanned PDF → OCR first 2 pages
    onStatus && onStatus('ocr'); let ocr = '';
    for (let p = 1; p <= Math.min(pdf.numPages, 2); p++) {
      const page = await pdf.getPage(p); const vp = page.getViewport({ scale: 2.2 });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
      ocr += (await ocrImage(cv, onStatus)) + '\n';
    }
    return { text: ocr, method: 'ocr', pages: pdf.numPages };
  }
  onStatus && onStatus('ocr');
  return { text: await ocrImage(file, onStatus), method: 'ocr', pages: 1 };
}
/* PDFs whose fonts have no text mapping (e.g. our Commercial Invoice export, Type 3 fonts) give junk text → use OCR */
function looksGarbled(text) {
  const s = text.replace(/\s/g, ''); if (!s) return true;
  const ok = (s.match(/[A-Za-z0-9.,:;\/$#%&()'"@+\-]/g) || []).length;
  return ok / s.length < 0.9 || !/\b(invoice|amount|total|usd|date|qty|quantity|price)\b/i.test(text);
}
/* preview: render PDF pages to PNG data URLs (works in every browser, no PDF plugin needed) */
async function renderPdfPages(file, maxPages = 5) {
  await pdfReady();
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(await file.arrayBuffer()) }).promise;
  const out = [];
  for (let p = 1; p <= Math.min(pdf.numPages, maxPages); p++) {
    const page = await pdf.getPage(p); const vp = page.getViewport({ scale: 1.6 });
    const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
    await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    out.push(cv.toDataURL('image/png'));
  }
  return { imgs: out, total: pdf.numPages };
}

/* ---------- date / money helpers ---------- */
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, sept: 9, oct: 10, nov: 11, dec: 12 };
const DATE_RX = [
  { rx: /\b(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})\b/g, f: m => [+m[1], +m[2], +m[3]] },
  { rx: /\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/g, f: m => { let a = +m[1], b = +m[2], y = +m[3]; if (y < 100) y += 2000; return a > 12 ? [y, b, a] : [y, a, b]; } },
  { rx: /\b(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})\b/gi, f: m => [+m[3], MON[m[1].toLowerCase()], +m[2]] },
  { rx: /\b(\d{1,2})[\s\-]+(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\.?[\s\-,]+(\d{4}|\d{2})\b/gi, f: m => { let y = +m[3]; if (y < 100) y += 2000; return [y, MON[m[2].toLowerCase()], +m[1]]; } },
];
function findDates(s) {
  const out = [];

}
const MONEY_RX = /(?:USD|US\$|\$)?\s?\(?-?\d{1,3}(?:,\d{3})+(?:\.\d{2})?\)?|(?:USD|US\$|\$)?\s?\(?-?\d+\.\d{2}\)?/g;

  const out = []; MONEY_RX.lastIndex = 0; let m;
  while ((m = MONEY_RX.exec(s))) {

/* ---------- vendor detection ---------- */
function detectVendor(text, fileName) {
  let nt = normWords(text);
  for (const sn of shared('selfNames', ['JNF AM LLC', 'JNF AM', 'JNFAM'])) nt = nt.split(normWords(sn)).join(' ');
  const nf = normWords(fileName);
  let best = null;
  for (const v of S.vendors) {
    if (v.active === false) continue;
    let score = 0;
    for (const a of [v.name, ...(v.aliases || [])]) {
      const na = normWords(a).trim(); if (na.length < 3) continue;
      if (nt.includes(' ' + na + ' ')) score = Math.max(score, 10 + na.length);
      else if (nf.includes(' ' + na + ' ')) score = Math.max(score, 5 + na.length);
    }
    if (v.invRegex) { try { if (new RegExp(v.invRegex, 'i').test(text) || new RegExp(v.invRegex, 'i').test(fileName)) score += 25; } catch { } }
    if (score && (!best || score > best.score)) best = { v, score };
  }
  return best ? best.v : null;
}

function parseInvoiceText(text, fileName = '') {
  const lines = text.split('\n').map(s => s.replace(/\s+$/, '')).filter(s => s.trim());
  const res = { vendorId: '', invoiceNo: '', invoiceDate: '', dueDate: '', amount: '', memo: '', poNo: '', product: '', terms: null, conf: {} };
  const vendor = detectVendor(text, fileName);
  if (vendor) { res.vendorId = vendor.id; res.conf.vendorId = 'hi'; }

  // invoice number
  const isDateLike = s => findDates(s).length > 0;
  const badNo = s => !s || s.length < 3 || !/\d/.test(s) || isDateLike(s) || /^\$?[\d,]+\.\d{2}$/.test(s) || /^(date|number|no|page)$/i.test(s);
  { const m = text.match(OUR_INV_RX) || fileName.match(OUR_INV_RX); if (m) { res.invoiceNo = m[1].replace(/\s+/g, '').toUpperCase(); res.conf.invoiceNo = 'hi'; } }
  if (!res.invoiceNo && vendor && vendor.invRegex) { try { const m = text.match(new RegExp(vendor.invRegex, 'i')); if (m) { res.invoiceNo = m[0]; res.conf.invoiceNo = 'hi'; } } catch { } }
  const LBL_NO = /(invoice|inv|bill|statement|document|reference)\s*(?:no\.?|number|num|#|id)\s*[:#.]?\s*/i;
  if (!res.invoiceNo) {
    for (let i = 0; i < lines.length && !res.invoiceNo; i++) {
      const L0 = lines[i]; const m = L0.match(LBL_NO); if (!m) continue;
      const after = L0.slice(m.index + m[0].length).trim().split(/\s{2,}|\s(?=[A-Z][a-z])/)[0].split(/\s+/)[0];
      if (!badNo(after)) { res.invoiceNo = after.replace(/[,;]$/, ''); res.conf.invoiceNo = 'hi'; break; }
      // header-row style: value on next line in similar column order
      const nx = lines[i + 1] || ''; const hdr = L0.split(/\s{2,}/); const vals = nx.split(/\s{2,}/);
      const col = hdr.findIndex(h => LBL_NO.test(h + ' '));
      const cand = (col >= 0 && vals[col]) ? vals[col].trim().split(/\s+/)[0] : (vals.find(x => !badNo(x.trim())) || '').trim().split(/\s+/)[0];
      if (!badNo(cand)) { res.invoiceNo = cand; res.conf.invoiceNo = 'mid'; }
    }

  if (!res.invoiceNo) { const m = text.match(/\binvoice\s*[:#]\s*([A-Z0-9][A-Z0-9\-\/]{2,})/i); if (m && !badNo(m[1])) { res.invoiceNo = m[1]; res.conf.invoiceNo = 'mid'; } }

  // dates
  const pickLabeled = rx => {
    for (let i = 0; i < lines.length; i++) {

      const d = findDates(lines[i].slice(m.index)); if (d.length) return d[0].v;
      const hdr = lines[i].split(/\s{2,}/); const col = hdr.findIndex(h => rx.test(h));
      const nx = lines[i + 1] || ''; const vals = nx.split(/\s{2,}/);
      if (col >= 0 && vals[col]) { const d2 = findDates(vals[col]); if (d2.length) return d2[0].v; }
      const d3 = findDates(nx); if (d3.length) return d3[0].v;

    return '';
  };
  res.dueDate = pickLabeled(/(due\s*date|payment\s*due|due\s*by|pay\s*by|date\s*due)/i);
  if (res.dueDate) res.conf.dueDate = 'hi';
  res.invoiceDate = pickLabeled(/(invoice\s*date|inv\.?\s*date|date\s*of\s*invoice|billing\s*date|bill\s*date|statement\s*date|issue\s*date|date\s*issued|invoice\s*dt)/i);
  if (res.invoiceDate) res.conf.invoiceDate = 'hi';
  if (!res.invoiceDate) { const d = pickLabeled(/(^|\s)date\s*[:]?/i); if (d && d !== res.dueDate) { res.invoiceDate = d; res.conf.invoiceDate = 'mid'; } }
  if (!res.invoiceDate && invNoDate(res.invoiceNo)) { res.invoiceDate = invNoDate(res.invoiceNo); res.conf.invoiceDate = 'mid'; }
  if (!res.invoiceDate) { const all = findDates(text).filter(d => d.v !== res.dueDate); if (all.length) { res.invoiceDate = all[0].v; res.conf.invoiceDate = 'mid'; } }

  // amount
  const LBLS = [/balance\s*due/i, /amount\s*due/i, /net\s*amount/i, /amount\s*after/i, /total\s*(amount\s*)?due/i, /please\s*pay/i, /pay\s*this\s*amount/i, /invoice\s*total/i, /grand\s*total/i, /total\s*amount/i, /total\s*(usd|\(usd\))/i, /new\s*balance/i, /\btotal\b/i];
  let best = null;
  lines.forEach((ln, i) => {
    if (/sub\s*-?total|total\s*tax|tax\s*total|total\s*(qty|quantity|weight|pages?|units?|items?)/i.test(ln)) return;
    const p = LBLS.findIndex(rx => rx.test(ln)); if (p < 0) return;
    const after = ln.slice(ln.search(LBLS[p]));
    let ms = findMoney(after); if (!ms.length) ms = findMoney(lines[i + 1] || '');
    if (!ms.length) return;
    const v = ms[ms.length - 1].v;
    if (!best || p < best.p || (p === best.p && v > best.v)) best = { p, v };

  else { const all = findMoney(text).filter(m => m.v > 0); if (all.length) { res.amount = r2(Math.max(...all.map(m => m.v))); res.conf.amount = 'mid'; } }

    }
  }
  // PO number (customer purchase order)
  { const m = text.match(/\bP\s*\/?\s*O\s*(?:no\.?|number|#)?\s*[:#.]?\s*(\d{6,})/i) || text.match(/\b(?:customer\s*)?P\.?\s?O\.?\s*(?:no\.?|number|#)?\s*[:#.]?\s*([A-Z0-9][A-Z0-9\-]{4,})/i); if (m && /\d{4}/.test(m[1]) && !OUR_INV_RX.test(m[1])) { res.poNo = m[1]; res.conf.poNo = 'hi'; } }
  // JNFAM Commercial Invoice layout: line item "HF 49%  Hydrofluoric Acid (HF) 49%  18,570 Kg ISO  USD 2.60  USD 48,282.00", total "USD 48,282.00"
  if (/commercial\s+invoice|consignee/i.test(text)) {
    const items = lines.filter(l => !/^\s*[\d,]+(?:\.\d+)?\s*(kg|lbs?|gal|ea|mt)\b/i.test(l) && /[\d,]+(?:\.\d+)?\s*(kg|lbs?|gal|ea|mt)\b/i.test(l) && /(USD|US\$|\$)\s*[\d,]+\.\d{2}/i.test(l));
    if (items.length) {
      const parts = items.map(l => { const q = l.match(/([\d,]+(?:\.\d+)?)\s*(kg|lbs?|gal|ea|mt)\b/i); const lead = (l.match(/^\s*([A-Za-z0-9]+(?:\s+\d+(?:\.\d+)?%)?)/) || [])[1] || ''; const up = (l.match(/(?:USD|US\$|\$)\s*([\d,]*\.\d{2,4})/i) || [])[1]; return { lead, q: q ? `${q[1]} ${q[2]}` : '', up, amt: findMoney(l).map(m => m.v).filter(v => v > 0).pop() || 0 }; });

      const sumItems = r2(parts.reduce((s, p) => s + p.amt, 0));
      const usd = []; for (const l of lines) for (const m of l.matchAll(/(?:USD|US\$|usp|\$)\s*([\d,]+\.\d{2})\b/gi)) usd.push(+m[1].replace(/,/g, ''));
      const tot = usd.length ? Math.max(...usd) : sumItems;
      if (tot) { res.amount = r2(tot); res.conf.amount = Math.abs(tot - sumItems) < 0.01 || usd.filter(v => v === tot).length > 1 ? 'hi' : 'mid'; }
    }

    const ci = lines.findIndex(l => /consignee/i.test(l));

  return res;
}

async function aiParse(file) {

  const data = await fileToB64(file);
  const vendorList = S.vendors.filter(v => v.active !== false).map(v => v.name).join(' | ');
  const prompt = `You are reading a SALES invoice (accounts receivable) ISSUED BY our company "JNF AM LLC" (also JNFAM). We are the seller; the customer is the Bill-To / Sold-To party, never JNF AM.
Our invoice numbers look like JAIN-YYMMDD[suffix] (e.g. JAIN-260824A, JAIN-20260205) or JNFAMYYMMDD[suffix].
Known customers: ${vendorList}
Return ONLY a JSON object, no prose:
{"customer_name": string (bill-to company as printed), "matched_customer": string|null (exactly one of the known customers if it is the same company, else null), "invoice_number": string|null, "invoice_date": "YYYY-MM-DD"|null, "due_date": "YYYY-MM-DD"|null, "total_amount": number|null (the amount the customer must pay on this invoice, i.e. after any deposit deduction, in invoice currency), "currency": string, "payment_terms": string|null, "description": string (short memo under 60 chars in English, e.g. "HF 16 totes" or "ICP-MS analysis"), "product": one of ${JSON.stringify(PRODUCTS)}, "po_number": string|null}`;
  const j = await aiProxyCall({ action: 'parse', model, mediaType: isPdf ? 'application/pdf' : (file.type || 'image/png'), data, prompt });
  const txt = j.text || '';
  const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error('AI returned no JSON');
  const o = JSON.parse(m[0]);
  const res = { conf: {} };
  let v = o.matched_customer ? S.vendors.find(x => x.name === o.matched_customer) : null;
  if (!v && o.customer_name) v = detectVendor(o.customer_name, '');
  if (v) { res.vendorId = v.id; res.conf.vendorId = 'hi'; }
  res.vendorNameRaw = o.customer_name || '';
  if (o.invoice_number) { res.invoiceNo = String(o.invoice_number); res.conf.invoiceNo = 'hi'; }
  if (o.invoice_date) { res.invoiceDate = o.invoice_date; res.conf.invoiceDate = 'hi'; }
  if (o.due_date) { res.dueDate = o.due_date; res.conf.dueDate = 'hi'; }
  if (o.total_amount != null) { res.amount = r2(o.total_amount); res.conf.amount = 'hi'; }
  if (o.description) { res.memo = o.description; res.conf.memo = 'hi'; }
  if (o.po_number) { res.poNo = String(o.po_number); res.conf.poNo = 'hi'; }
  if (o.product && PRODUCTS.includes(o.product)) { res.product = o.product; res.conf.product = 'hi'; }

  return res;
}

/* ---------- duplicate check ---------- */
function findDuplicates(f, exceptId) {
  const out = [];
  const nk = normKey(f.invoiceNo);
  for (const i of S.invoices) {
    if (i.id === exceptId || i.vendorId !== f.vendorId) continue;
    if (nk && nk.length >= 3 && (normKey(i.invoiceNo) === nk || normKey(i.srcRef).endsWith(nk))) out.push(i);
    else if (f.amount && Math.abs((+i.amount) - (+f.amount)) < 0.005 && i.invoiceDate === f.invoiceDate) out.push(i);
  }
  return out;
}

/* period aggregation: per-customer roll-forward + monthly table */
function periodStats(r, inclIC) {
  const prev = addDays(r.from, -1);
  const cO = compute({ asOf: prev, inclIC }), cC = compute({ asOf: r.to, inclIC });
  const ok = id => inclIC || !isIC(vendorById(id));
  const inRange = d => d && d >= r.from && d <= r.to;
  const rows = new Map();
  const row = id => { if (!rows.has(id)) rows.set(id, { vendorId: id, opening: cO.byV.get(id)?.balance || 0, invoiced: 0, nInv: 0, received: 0, nPay: 0, adj: 0, closing: cC.byV.get(id)?.balance || 0, overdue: cC.byV.get(id)?.overdue || 0, aging: cC.byV.get(id)?.aging || [0, 0, 0, 0, 0] }); return rows.get(id); };
  S.vendors.filter(v => ok(v.id)).forEach(v => row(v.id));
  const prod = new Map();
  for (const i of S.invoices) { if (!ok(i.vendorId) || !inRange(i.invoiceDate)) continue; const x = row(i.vendorId); x.invoiced = r2(x.invoiced + (+i.amount || 0)); x.nInv++; for (const ln of invLines(i)) { const p = ln.product || i.product || ''; prod.set(p, r2((prod.get(p) || 0) + (+ln.amount || 0))); } }
  for (const p of S.payments) { if (!ok(p.vendorId) || !inRange(p.date)) continue; const x = row(p.vendorId); x.received = r2(x.received + (+p.amount || 0)); x.adj = r2(x.adj + (+p.fee || 0)); x.nPay++; }
  const list = [...rows.values()];
  const sum = k => r2(list.reduce((s, x) => s + (x[k] || 0), 0));
  const tot = { opening: sum('opening'), invoiced: sum('invoiced'), nInv: sum('nInv'), received: sum('received'), nPay: sum('nPay'), adj: sum('adj'), closing: sum('closing'), overdue: sum('overdue'), aging: cC.tot.aging };
  // monthly rows: months touched by the period; a single-month period shows the 12 months ending with it
  const months = []; let [y, m] = r.from.slice(0, 7).split('-').map(Number); const [ey, em] = r.to.slice(0, 7).split('-').map(Number);
  if (y === ey && m === em) { const s = new Date(ey, em - 12, 1); y = s.getFullYear(); m = s.getMonth() + 1; }
  while (y < ey || (y === ey && m <= em)) { months.push(`${y}-${pad(m)}`); m++; if (m > 12) { m = 1; y++; } }
  const monthly = months.map(mo => {
    const [yy, mm] = mo.split('-').map(Number); const end = minD(monthEnd(yy, mm), todayStr()); const st = mo + '-01';
    const inv = S.invoices.filter(i => ok(i.vendorId) && i.invoiceDate >= st && i.invoiceDate <= end);
    const pay = S.payments.filter(p => ok(p.vendorId) && p.date >= st && p.date <= end);
    return { mo, invoiced: r2(inv.reduce((s, i) => s + (+i.amount || 0), 0)), received: r2(pay.reduce((s, p) => s + (+p.amount || 0), 0)), adj: r2(pay.reduce((s, p) => s + (+p.fee || 0), 0)), closing: st <= todayStr() ? compute({ asOf: end, inclIC }).tot.balance : null, inPeriod: end >= r.from && st <= r.to };
  });

}

/* ---------- Excel invoice source → text for the rule parser ---------- */
async function xlsxToText(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false, cellNF: true });
  const out = [];
  for (const n of wb.SheetNames.slice(0, 3)) {
    const ws = wb.Sheets[n]; if (!ws['!ref']) continue;
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '', blankrows: false });
    for (const r of rows) { const line = r.map(c => String(c).replace(/\s+/g, ' ').trim()).filter(Boolean).join('   '); if (line) out.push(line); }
    out.push('---');
  }
  return out.join('\n');
}

  let h = pageHead(t('invoices'), t('showing', { n: shown.length, m: list.length }), `${asOfCtl()}<button class="btn ed" data-act="payFor">💳 ${t('payFor')}</button><button class="btn pri ed" data-act="newInv">＋ ${t('newInvoice')}</button>`);
  h += `<div class="filters">
    <input class="inp" id="fq" placeholder="${t('search')}" value="${esc(f.q)}" style="width:220px">
    <select class="inp" id="fv">${vendorOptions(f.vendor).replace(t('selVendor'), LANG === 'ko' ? '전체 업체' : 'All vendors')}</select>

  </div>`;
  h += `<div class="card"><div class="tbl-wrap tbl-scroll"><table class="t"><thead><tr><th><input type="checkbox" id="selAll"></th>${th('invoiceDate', t('invDate'))}${th('vendor', t('vendor'))}${th('invoiceNo', t('invNo'))}<th>${t('memo')}</th>${th('amount', t('amount'), 'num')}${th('open', t('open'), 'num')}${th('due', t('dueDate'))}<th>${t('status')}</th><th></th></tr></thead><tbody>
  ${shown.map(i => { const x = c.inv.get(i.id); const st = invStatus(i, x); return `<tr><td><input type="checkbox" class="selInv" value="${i.id}" ${st === 'paid' ? 'disabled' : ''}></td><td>${i.invoiceDate || '<span class="muted">—</span>'}</td><td class="wrap"><a class="link" data-act="vendor" data-id="${i.vendorId}">${esc(vName(i.vendorId))}</a></td><td class="wrap" title="${esc(i.srcRef || '')}">${esc(i.invoiceNo) || '<span class="muted">—</span>'}</td><td class="wrap muted" title="${esc(i.memo)}${i.poNo ? ' · PO ' + esc(i.poNo) : ''}">${esc(i.memo)}${i.poNo ? ` <span style="font-size:11px">· PO ${esc(i.poNo)}</span>` : ''}</td><td class="num">${money(i.amount)}</td><td class="num">${x && Math.abs(x.open) > 0.004 ? money(x.open) : '<span class="muted">–</span>'}</td><td>${x?.due || ''}${x && x.dpd > 0 && x.open > 0.004 ? ` <span class="muted">(${t('dayN', { n: x.dpd })})</span>` : ''}</td><td>${badge(st)} ${i.needsReview ? `<span class="b review" title="${esc((i.reviewFlags || []).map(k => t('rv_' + k, { y: (i.invoiceDate || '').slice(0, 4) })).join('\n'))}">!</span>` : ''}</td><td style="white-space:nowrap">${invAttachment(i) ? `<button class="btn sm ghost" data-act="viewFile" data-id="${i.id}" title="${esc(invAttachment(i).path || invAttachment(i).name || t('attachment'))}">📎</button>` : ''}<button class="btn sm" data-act="editInv" data-id="${i.id}">${t('edit')}</button>${st !== 'paid' ? ` <button class="btn sm ed" data-act="payInv" data-id="${i.id}">${t('payment')}</button>` : ''}</td></tr>`; }).join('') || `<tr><td colspan="10" class="empty">${t('noData')}</td></tr>`}
  </tbody></table>${list.length > f.limit ? `<div style="padding:12px;text-align:center"><button class="btn" data-act="moreInv">+ ${list.length - f.limit}</button></div>` : ''}</div></div>`;
  setTimeout(() => {
    $('#fq').oninput = debounce(e => { UI.inv.q = e.target.value; render(true); }, 250);
    $('#fv').onchange = e => { UI.inv.vendor = e.target.value; render(); };
    $('#fs').onchange = e => { UI.inv.status = e.target.value; render(); };
    $('#ff').onchange = e => { UI.inv.from = e.target.value; render(); };
    $('#ft').onchange = e => { UI.inv.to = e.target.value; render(); };
    $('#selAll').onchange = e => $$('.selInv:not(:disabled)').forEach(x => x.checked = e.target.checked);
  });
  return h;
}

ACT.editInv = el => invoiceModal(S.invoices.find(i => i.id === el.dataset.id));

/* ---------- invoice modal ---------- */
function invoiceModal(inv, preset = {}) {

    <div class="f full"><label>${t('memo')}</label><input class="inp" id="iMemo" value="${esc(inv.memo)}"></div>
    <div class="f"><label>${t('account')}</label><select class="inp" id="iAcc">${productOptions(inv.product || productOf(inv.memo))}</select><span class="hint" id="iAccHint"></span></div>
    <div class="f"><label>${t('poNo')}</label><input class="inp" id="iPo" value="${esc(inv.poNo || '')}"></div>
    <div class="f"><label>${t('salesAmtFull')}</label><div style="display:flex;gap:6px"><input class="inp" id="iSales" type="number" step="0.01" value="${inv.salesAmount ?? ''}" placeholder="= ${t('amount')}" style="flex:1"><button class="btn sm ed" type="button" id="iSalesX2">× 2</button></div><span class="hint">${t('salesHint')}</span></div>
    <div class="f"><label>${t('note')}</label><input class="inp" id="iNote" value="${esc(inv.note || '')}"></div>
    ${inv.lines && inv.lines.length > 1 ? `<div class="f full"><label>${LANG === 'ko' ? '품목 라인 (엑셀)' : 'Lines (Excel)'}</label><div class="muted" style="font-size:12px">${inv.lines.map(l => `${esc(l.memo || '—')} · ${money(l.amount)}`).join('<br>')}</div></div>` : ''}
    ${inv.needsReview ? `<div class="f full"><div class="warnbox">${(inv.reviewFlags || []).map(k => '• ' + t('rv_' + k, { y: (inv.invoiceDate || '').slice(0, 4) })).join('<br>')}<br><label class="chk" style="margin-top:6px;color:var(--warn)"><input type="checkbox" id="iRev" checked> ${t('clearReview')}</label></div></div>` : ''}
    <div class="f full" id="iDupBox"></div>
  </div>
  ${!isNew ? `<div style="margin-top:16px"><div style="font-weight:600;font-size:13px;margin-bottom:6px">${t('payHistory')}</div>${pays.length ? `<table class="t"><thead><tr><th>${t('payDate')}</th><th>${t('method')}</th><th class="num">${t('applied')}</th><th></th></tr></thead><tbody>${pays.map(p => `<tr><td>${p.date || '—'}</td><td>${p.method ? t('methods_' + p.method) : ''}</td><td class="num">${money((p.allocations.find(a => a.invoiceId === inv.id) || {}).amount)}</td><td><button class="btn sm" data-act="editPay" data-id="${p.id}">${t('edit')}</button></td></tr>`).join('')}</tbody></table><div class="pill-sum"><span>${t('paid')} <b>${money(x.applied)}</b></span><span>${t('open')} <b>${money(x.open)}</b></span></div>` : `<div class="muted">${t('noPay')}</div>`}</div>` : ''}`;
  const foot = `${!isNew ? `<button class="btn danger ed" data-act="delInv" data-id="${inv.id}">${t('del')}</button>` : ''}${inv.issue ? ` <button class="btn" data-act="reprint" data-id="${inv.id}">🧾 ${t('reprint')}</button>` : ''}<span class="sp"></span><button class="btn" data-act="closeModal">${t('cancel')}</button>${!isNew && x && x.open > 0.004 ? `<button class="btn ed" data-act="payInv" data-id="${inv.id}">${t('recordPayment')}</button>` : ''}<button class="btn pri ed" id="iSave">${t('save')}</button>`;
  openModal({ title: isNew ? t('newInvoice') : `${t('invoiceDetail')} · ${esc(inv.invoiceNo || '')}`, body, foot });
  const upd = () => {
    const v = vendorById($('#iV').value); const d = $('#iDate').value;
    $('#iDueHint').textContent = v && d ? '· ' + t('autoDue', { d: calcDue(d, v.terms) }) + ` (${termsLabel(v.terms)})` : '';
    const d2 = findDuplicates({ vendorId: $('#iV').value, invoiceNo: $('#iNo').value, amount: +$('#iAmt').value, invoiceDate: d }, inv.id);

  };
  $('#iSalesX2').onclick = () => { $('#iSales').value = r2((+$('#iAmt').value || 0) * 2); };
  ['iV', 'iDate', 'iNo', 'iAmt'].forEach(id => $('#' + id).addEventListener('input', upd)); upd();
  $('#iSave').onclick = async () => {
    const doc = { ...inv, vendorId: $('#iV').value, invoiceNo: $('#iNo').value.trim(), amount: r2($('#iAmt').value), invoiceDate: $('#iDate').value, dueDate: $('#iDue').value, memo: $('#iMemo').value.trim(), note: $('#iNote').value.trim(), product: $('#iAcc').value, poNo: $('#iPo').value.trim(), salesAmount: $('#iSales').value === '' ? null : r2($('#iSales').value) };
    if (doc.lines && doc.lines.length === 1) delete doc.lines;
    if (!doc.vendorId || !doc.invoiceDate || !$('#iAmt').value) return toast(t('required'), true);
    if ($('#iRev') && $('#iRev').checked) { doc.needsReview = false; doc.reviewFlags = []; }
    if (isNew) doc.seq = Date.now();
    await Store.put('invoices', doc); closeModal(); toast(t('savedT')); render();
  };
}
ACT.delInv = async el => {
  if (!confirm(t('confirmDel'))) return;
  const id = el.dataset.id; const inv = S.invoices.find(i => i.id === id);
  for (const p of S.payments.filter(p => (p.allocations || []).some(a => a.invoiceId === id))) { p.allocations = p.allocations.filter(a => a.invoiceId !== id); await Store.put('payments', p); }
  await Store.del('invoices', id); closeModal(); toast(t('deleted')); render();
};

/* ---------- payment modal ---------- */
function paymentModal(pay, preset = {}) {
  const isNew = !pay; pay = pay ? JSON.parse(JSON.stringify(pay)) : { vendorId: preset.vendorId || '', date: todayStr(), amount: '', fee: 0, method: 'Wire', ref: '', memo: '', allocations: [] };
  const own = new Map((pay.allocations || []).map(a => [a.invoiceId, +a.amount]));
  const body = `<div class="form">
    <div class="f full"><label>${t('vendor')} *</label><select class="inp" id="pV" ${pay.allocations.length && !isNew ? 'disabled' : ''}>${vendorOptions(pay.vendorId, true, true)}</select></div>
    <div class="f"><label>${t('payDate')}</label><input class="inp" type="date" id="pD" value="${pay.date || ''}"></div>
    <div class="f"><label>${t('method')}</label><select class="inp" id="pM"><option value="">—</option>${METHODS.map(m => `<option value="${m}" ${pay.method === m ? 'selected' : ''}>${t('methods_' + m)}</option>`).join('')}</select></div>
    <div class="f"><label>${t('amount')} (USD) *</label><input class="inp" type="number" step="0.01" id="pA" value="${pay.amount}"></div>
    <div class="f"><label>${t('fee')}</label><input class="inp" type="number" step="0.01" id="pF" value="${pay.fee || ''}"><span class="hint">${t('adjHint')}</span></div>
    <div class="f"><label>${t('ref')}</label><input class="inp" id="pR" value="${esc(pay.ref || '')}" placeholder="Check # / ACH / Wire ref"></div>
    <div class="f"><label>${t('memo')}</label><input class="inp" id="pMemo" value="${esc(pay.memo || '')}"></div>
  </div>
  ${pay.needsReview ? `<div class="warnbox" style="margin-top:12px">${(pay.reviewFlags || []).map(k => '• ' + t('pv_' + k)).join('<br>')}<br><label class="chk" style="margin-top:6px;color:var(--warn)"><input type="checkbox" id="pRev" checked> ${t('clearReview')}</label></div>` : ''}
  <div style="margin-top:16px;display:flex;align-items:center;gap:8px"><b style="font-size:13px">${t('appliedTo')}</b><span class="sp" style="flex:1"></span><button class="btn sm ed" id="pAuto">${t('autoAlloc')}</button></div>
  <div class="tbl-wrap" style="max-height:300px;margin-top:6px" id="pAllocBox"></div>
  <div class="pill-sum" id="pSum"></div>`;
  const foot = `${!isNew ? `<button class="btn danger ed" data-act="delPay" data-id="${pay.id}">${t('del')}</button>` : ''}<span class="sp"></span><button class="btn" data-act="closeModal">${t('cancel')}</button><button class="btn pri ed" id="pSave">${t('save')}</button>`;
  openModal({ title: isNew ? t('recordPayment') : t('paymentDetail'), body, foot, wide: true });
  const c = compute({ asOf: '2999-12-31' });
  let rows = [];
  const buildRows = () => {
    const vid = $('#pV').value;
    rows = S.invoices.filter(i => i.vendorId === vid).map(i => { const x = c.inv.get(i.id); const avail = r2((x ? x.open : +i.amount) + (own.get(i.id) || 0)); return { i, avail, alloc: own.get(i.id) || 0 }; })
      .filter(r => r.avail > 0.004 || r.alloc > 0).sort((a, b) => (a.i.invoiceDate || '').localeCompare(b.i.invoiceDate || '') || (a.i.seq || 0) - (b.i.seq || 0));
    if (isNew && preset.invoiceIds && vid === preset.vendorId) rows.forEach(r => { if (preset.invoiceIds.includes(r.i.id)) r.alloc = r.avail; });
    drawRows();
    if (isNew && preset.invoiceIds && !$('#pA').value) { $('#pA').value = r2(rows.reduce((s, r) => s + r.alloc, 0)); }
    sum();
  };
  const drawRows = () => {
    $('#pAllocBox').innerHTML = rows.length ? `<table class="t alloc"><thead><tr><th></th><th>${t('invDate')}</th><th>${t('invNo')}</th><th>${t('memo')}</th><th class="num">${t('open')}</th><th class="num">${t('applied')}</th></tr></thead><tbody>${rows.map((r, k) => `<tr><td><input type="checkbox" data-k="${k}" class="pChk" ${r.alloc > 0 ? 'checked' : ''}></td><td>${r.i.invoiceDate}</td><td>${esc(r.i.invoiceNo)}</td><td class="wrap muted">${esc(r.i.memo)}</td><td class="num">${money(r.avail)}</td><td class="num"><input class="inp pAl" data-k="${k}" type="number" step="0.01" value="${r.alloc ? r2(r.alloc) : ''}"></td></tr>`).join('')}</tbody></table>` : `<div class="muted" style="padding:10px">${LANG === 'ko' ? '미수 인보이스가 없습니다 — 미배분 입금(선수금 등)으로 저장됩니다.' : 'No open invoices — will be saved as an unapplied receipt (prepayment).'}</div>`;
    $$('.pChk').forEach(ch => ch.onchange = () => { const r = rows[ch.dataset.k]; if (ch.checked) { const rem = r2((+$('#pA').value || 0) + (+$('#pF').value || 0) - rows.reduce((s, x) => s + x.alloc, 0)); r.alloc = $('#pA').value ? Math.max(0, Math.min(r.avail, rem)) || r.avail : r.avail; } else r.alloc = 0; drawRows(); sum(); });
    $$('.pAl').forEach(inp => inp.oninput = () => { rows[inp.dataset.k].alloc = r2(inp.value); sum(); });
  };
  const sum = () => {
    const amt = +$('#pA').value || 0, fee = +$('#pF').value || 0, al = r2(rows.reduce((s, r) => s + (+r.alloc || 0), 0)); const un = r2(amt + fee - al);
    $('#pSum').innerHTML = `<span>${t('amount')} <b>${money(amt)}</b></span><span>${t('applied')} <b>${money(al)}</b></span><span>${t('fee')} <b>${money(fee)}</b></span><span>${t('unapplied')} <b style="${un < -0.004 ? 'color:var(--bad)' : ''}">${money(un)}</b></span>${un > 0.004 ? `<span class="muted" style="flex-basis:100%">${t('unappliedNote')}</span>` : ''}`;
  };
  $('#pV').onchange = () => { own.clear(); buildRows(); };
  $('#pA').oninput = sum; $('#pF').oninput = sum;
  $('#pAuto').onclick = () => { let rem = r2((+$('#pA').value || 0) + (+$('#pF').value || 0)); rows.forEach(r => { const a = Math.max(0, Math.min(r.avail, rem)); r.alloc = r2(a); rem = r2(rem - a); }); drawRows(); sum(); };
  buildRows();
  $('#pSave').onclick = async () => {
    const amt = r2($('#pA').value); if (!$('#pV').value) return toast(t('vendorReq'), true); if (!amt) return toast(t('amtReq'), true);
    for (const r of rows) if (r.alloc > r.avail + 0.004) return toast(`${r.i.invoiceNo}: ${t('applied')} > ${t('open')}`, true);
    const doc = { ...pay, vendorId: $('#pV').value, date: $('#pD').value, method: $('#pM').value, amount: amt, fee: r2($('#pF').value), ref: $('#pR').value.trim(), memo: $('#pMemo').value.trim(), allocations: rows.filter(r => r.alloc > 0.004).map(r => ({ invoiceId: r.i.id, amount: r2(r.alloc) })) };
    if (payUnapplied(doc) < -0.004) return toast(t('overAlloc'), true);
    if (doc.needsReview && $('#pRev') && $('#pRev').checked) { doc.needsReview = false; doc.reviewFlags = []; }
    await Store.put('payments', doc); closeModal(); toast(t('savedT')); render();
  };
}
ACT.editPay = el => paymentModal(S.payments.find(p => p.id === el.dataset.id));
ACT.newPay = el => paymentModal(null, { vendorId: el.dataset.vendor || UI.pay.vendor || '' });
ACT.delPay = async el => { if (!confirm(t('confirmDel'))) return; await Store.del('payments', el.dataset.id); closeModal(); toast(t('deleted')); render(); };

/* =================== PAYMENTS =================== */
function vPayments() {
  if (!S.vendors.length) return welcome();
  const f = UI.pay; const q = f.q.toLowerCase();
  const ok = id => UI.inclIC || !isIC(vendorById(id));
  let list = S.payments.filter(p => ok(p.vendorId) && (!f.review || p.needsReview) && (!f.vendor || p.vendorId === f.vendor) && (!f.method || p.method === f.method) && (!f.from || (p.date || '') >= f.from) && (!f.to || (p.date || '9') <= f.to)
    && (!q || `${vName(p.vendorId)} ${p.ref} ${p.memo} ${p.amount} ${(p.allocations || []).map(a => S.invoices.find(i => i.id === a.invoiceId)?.invoiceNo).join(' ')}`.toLowerCase().includes(q)));
  list.sort((a, b) => (b.date || '9999').localeCompare(a.date || '9999'));
  const tot = list.reduce((s, p) => s + (+p.amount || 0), 0);
  const shown = list.slice(0, f.limit);
  let h = pageHead(t('payments'), t('showing', { n: shown.length, m: list.length }), `<label class="chk"><input type="checkbox" id="inclIC" ${UI.inclIC ? 'checked' : ''}> ${t('inclIC')}</label><button class="btn pri ed" data-act="newPay">＋ ${t('recordPayment')}</button>`);
  h += `<div class="filters"><input class="inp" id="gq" placeholder="${t('search')}" value="${esc(f.q)}" style="width:220px"><select class="inp" id="gv">${vendorOptions(f.vendor).replace(t('selVendor'), LANG === 'ko' ? '전체 업체' : 'All vendors')}</select>
  <label class="chk"><input type="checkbox" id="grv" ${f.review ? 'checked' : ''}> ${t('needReview')}</label>
  <select class="inp" id="gm"><option value="">${t('method')}: ${t('all')}</option>${METHODS.map(m => `<option value="${m}" ${f.method === m ? 'selected' : ''}>${t('methods_' + m)}</option>`).join('')}</select>
  <label class="chk">${t('from')} <input type="date" class="inp" id="gf" value="${f.from}"></label><label class="chk">${t('to')} <input type="date" class="inp" id="gt" value="${f.to}"></label>

function showImportReport(res) {

  const cents = S.invoices.filter(i => (i.reviewFlags || []).includes('cent')).length;
  const lump = S.payments.filter(p => (p.reviewFlags || []).includes('lump')).length;
  const ko = LANG === 'ko';
  const body = `<div class="okbox">${t('importDone')}: ${t('countsLine', { v: res.vendors.length, i: res.invoices.length, p: res.payments.length })}</div>
   <div class="pill-sum" style="margin-bottom:12px"><span>${t('excelBal')} <b>${money(totEx)}</b></span><span>${t('appBal')} <b>${money(totApp)}</b></span><span>${t('diff')} <b style="${Math.abs(totApp - totEx) > 0.004 ? 'color:var(--bad)' : ''}">${money(r2(totApp - totEx))}</b></span></div>
   <table class="t"><thead><tr><th>${t('vendor')}</th><th class="num">${t('excelBal')}</th><th class="num">${t('appBal')}</th><th class="num">${t('diff')}</th><th class="num">${t('unapplied')}</th></tr></thead><tbody>${res.report.map(r => `<tr><td>${esc(r.name)}</td><td class="num">${money(r.excelBal)}</td><td class="num">${money(r.appBal)}</td><td class="num ${Math.abs(r.diff) > 0.004 ? '' : 'muted'}">${Math.abs(r.diff) > 0.004 ? money(r.diff) : '–'}</td><td class="num ${Math.abs(r.credit) > 0.004 ? '' : 'muted'}">${Math.abs(r.credit) > 0.004 ? money(r.credit) : '–'}</td></tr>`).join('')}</tbody></table>
   <div style="font-size:12px;color:var(--text-2);margin-top:12px;line-height:1.7">
   • ${ko ? `일괄 입금 자동 배분 <b>${lump}</b>건 — 여러 인보이스를 한 번에 받은 입금을 같은 입금일 행 → 오래된 미수 순으로 배분했습니다. 입금 내역에서 "검토 필요"로 확인하세요.` : `<b>${lump}</b> lump-sum receipts were auto-allocated (same-date rows first, then oldest open). Check them under Receipts › Needs review.`}<br>
   • ${ko ? `몇 센트만 남은 미수 인보이스 <b>${cents}</b>건 — 반올림 차이로 덜 받은 건입니다. 합의된 차이면 입금의 "조정액"으로 정리하세요.` : `<b>${cents}</b> invoices are short by a few cents (rounding). Write them off with a receipt adjustment if agreed.`}<br>
   • ${ko ? `미배분 입금은 인보이스에 매칭되지 않은 초과 입금(1센트 초과, 정산금 등)으로, Aging에서는 오래된 미수부터 차감됩니다.` : `Unapplied = receipts larger than matched invoices (1¢ overpayments, settlements); aging nets them against the oldest open invoices.`}<br>
   • ${ko ? `검토 필요: 인보이스 ${review}건 · 입금 ${payRv}건` : `Needs review: ${review} invoices · ${payRv} receipts`}</div>`;
  openModal({ title: t('importReport'), body, foot: `<span class="sp"></span><button class="btn pri" data-act="closeModal">${t('close')}</button>`, wide: true });

/* ---------- Firestore adapter (same interface as LocalStore) ---------- */
const CloudStore = {
  mode: 'cloud', db: null, unsub: [],
  async init() {
    this.db = firebase.firestore();
    await Promise.all(COLS.map(c => new Promise((res, rej) => {
      let first = true;
      this.unsub.push(this.db.collection(CP + c).onSnapshot(snap => {
        S[c] = snap.docs.map(d => d.data());
        if (first) { first = false; res(); } else scheduleRender();
      }, err => { if (first) { first = false; rej(err); } else toast(err.message, true); }));
    })));
  },
  stop() { this.unsub.forEach(u => u()); this.unsub = []; },
  stamp: LocalStore.stamp,
  clean(d) { return JSON.parse(JSON.stringify(d)); },
  upsert(col, doc) { const i = S[col].findIndex(x => x.id === doc.id); if (i >= 0) S[col][i] = doc; else S[col].push(doc); },
  async put(col, doc, noStamp) {
    if (!doc.id) doc.id = uid(); if (!noStamp) this.stamp(doc);
    const d = this.clean(doc); await this.db.collection(CP + col).doc(String(d.id)).set(d); this.upsert(col, d); return d;
  },
  async putMany(col, docs) {
    for (let i = 0; i < docs.length; i += 400) {
      const b = this.db.batch();
      docs.slice(i, i + 400).forEach(d => { if (!d.id) d.id = uid(); b.set(this.db.collection(CP + col).doc(String(d.id)), this.clean(d)); });
      await b.commit();
    }
    const map = new Map(S[col].map(x => [x.id, x])); docs.forEach(d => map.set(d.id, this.clean(d))); S[col] = [...map.values()];
  },
  async del(col, id) { await this.db.collection(CP + col).doc(String(id)).delete(); S[col] = S[col].filter(x => x.id !== id); },
  async clear() {
    for (const c of COLS) {
      const snap = await this.db.collection(CP + c).get();
      for (let i = 0; i < snap.docs.length; i += 400) { const b = this.db.batch(); snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref)); await b.commit(); }
      S[c] = [];
    }
  },
  async putFile() { throw new Error('Files are not stored'); }, async getFile() { return null; }, async delFile() { }, async allFiles() { return []; },

function scheduleRender() {
